services:
  k6-runner:
    build: .
    container_name: sfm-k6-runner
    environment:
      PORT: "3000"
      RUNNER_SERVICE_TOKEN: ${RUNNER_SERVICE_TOKEN:?Set RUNNER_SERVICE_TOKEN in .env}
      RUNNER_MAX_REQUESTS_PER_SECOND: ${RUNNER_MAX_REQUESTS_PER_SECOND:-1000}
      RUNNER_ALLOWED_TARGET_HOSTS: ${RUNNER_ALLOWED_TARGET_HOSTS:-sfm-backend,sfm-be,localhost,127.0.0.1,::1,host.docker.internal,sfmbe.duckdns.org}
      RUNNER_PRODUCTION_TARGET_HOSTS: ${RUNNER_PRODUCTION_TARGET_HOSTS:-sfmbe.duckdns.org}
      PRODUCTION_BACKEND_URL: ${PRODUCTION_BACKEND_URL:-https://sfmbe.duckdns.org}
      RUNNER_PRODUCTION_MAX_VUS: ${PRODUCTION_MAX_VUS:-25}
      RUNNER_PRODUCTION_MAX_REQUESTS_PER_SECOND: ${PRODUCTION_MAX_REQUESTS_PER_SECOND:-25}
      RUNNER_PRODUCTION_MAX_DURATION_SECONDS: ${PRODUCTION_MAX_DURATION_SECONDS:-120}
      SFM_BE_URL: ${SFM_BE_URL:-http://sfm-backend:8080}
      K6_PROMETHEUS_RW_SERVER_URL: ${K6_PROMETHEUS_RW_SERVER_URL:-http://sfm-prometheus:9090/api/v1/write}
      K6_PROMETHEUS_RW_TREND_STATS: ${K6_PROMETHEUS_RW_TREND_STATS:-p(95)}
      K6_PROMETHEUS_RW_USERNAME: ${K6_PROMETHEUS_RW_USERNAME:-}
      K6_PROMETHEUS_RW_PASSWORD: ${K6_PROMETHEUS_RW_PASSWORD:-}
    networks:
      - runner-control
      - sfm-upstream
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpus: 1.0
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  performance-lab:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: sfm-performance-lab
    environment:
      PORT: "4173"
      RUNNER_BASE_URL: http://k6-runner:3000
      RUNNER_SERVICE_TOKEN: ${RUNNER_SERVICE_TOKEN:?Set RUNNER_SERVICE_TOKEN in .env}
      RUNNER_MAX_REQUESTS_PER_SECOND: ${RUNNER_MAX_REQUESTS_PER_SECOND:-1000}
      RUNNER_ALLOWED_TARGET_HOSTS: ${RUNNER_ALLOWED_TARGET_HOSTS:-sfm-backend,sfm-be,localhost,127.0.0.1,::1,host.docker.internal,sfmbe.duckdns.org}
      RUNNER_PRODUCTION_TARGET_HOSTS: ${RUNNER_PRODUCTION_TARGET_HOSTS:-sfmbe.duckdns.org}
      LOCAL_BACKEND_URL: ${LOCAL_BACKEND_URL:-http://host.docker.internal:8080}
      LOCAL_PROMETHEUS_URL: ${LOCAL_PROMETHEUS_URL:-http://sfm-prometheus:9090}
      PRODUCTION_BACKEND_URL: ${PRODUCTION_BACKEND_URL:-https://sfmbe.duckdns.org}
      PRODUCTION_PROMETHEUS_URL: ${PRODUCTION_PROMETHEUS_URL:-http://127.0.0.1:19090}
      PRODUCTION_MAX_VUS: ${PRODUCTION_MAX_VUS:-25}
      PRODUCTION_MAX_REQUESTS_PER_SECOND: ${PRODUCTION_MAX_REQUESTS_PER_SECOND:-25}
      PRODUCTION_MAX_DURATION_SECONDS: ${PRODUCTION_MAX_DURATION_SECONDS:-120}
      PRODUCTION_SSH_HOST: ${PRODUCTION_SSH_HOST:-}
      PRODUCTION_SSH_USER: ${PRODUCTION_SSH_USER:-}
      PRODUCTION_SSH_PORT: ${PRODUCTION_SSH_PORT:-22}
      PRODUCTION_SSH_KEY_PATH: /run/ssh-secrets/production_key
      PRODUCTION_SSH_KNOWN_HOSTS_PATH: /run/ssh-secrets/known_hosts
      PRODUCTION_SSH_LOCAL_PORT: ${PRODUCTION_SSH_LOCAL_PORT:-19090}
      PRODUCTION_PROMETHEUS_REMOTE_HOST: ${PRODUCTION_PROMETHEUS_REMOTE_HOST:-}
      PRODUCTION_PROMETHEUS_REMOTE_PORT: ${PRODUCTION_PROMETHEUS_REMOTE_PORT:-0}
      PROMETHEUS_SFM_BE_JOB: ${PROMETHEUS_SFM_BE_JOB:-sfm-be}
    depends_on:
      k6-runner:
        condition: service_started
    networks:
      - runner-control
      - dashboard-edge
      - sfm-upstream
    volumes:
      - type: bind
        source: ./secrets
        target: /run/ssh-secrets
        read_only: true
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-4173}:4173"
    cpus: 0.5
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

networks:
  runner-control:
    internal: true
  dashboard-edge:
    driver: bridge
  sfm-upstream:
    external: true
    name: ${SFM_DOCKER_NETWORK:-sfm-network}
